<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tiffin">
  <title>Tiffin</title>
  <!-- The brand mark (ADR 0082): a sculpted three-tier tiffin carrier on a
       saffron tile. gui/build/icons/appicon.svg and TiffinMark.vue are the same mark. -->
  <defs>
    <linearGradient id="tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="46%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a2c0c"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="6%" r="72%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#fdba74" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="55%" stop-color="#ffedd5" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde2c4"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="75%" stop-color="#ffedd5" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="75%" stop-color="#ffedd5" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.50"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.5" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14.5" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="none" stroke="url(#rim)" stroke-width="1"/>
  <path d="M 15.2 21.3 H 13.7 C 12.6 21.3 11.8 22.1 11.8 23.2 V 47.7 C 11.8 48.8 12.6 49.6 13.7 49.6 H 15.2" fill="none" stroke="url(#rail)" stroke-width="1.35" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 48.8 21.3 H 50.3 C 51.4 21.3 52.2 22.1 52.2 23.2 V 47.7 C 52.2 48.8 51.4 49.6 50.3 49.6 H 48.8" fill="none" stroke="url(#rail)" stroke-width="1.35" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 23.1 18.6 V 14 C 23.1 11.5 25.1 9.5 27.6 9.5 H 36.4 C 38.9 9.5 40.9 11.5 40.9 14 V 18.6" fill="none" stroke="url(#handle)" stroke-width="2.7" stroke-linecap="round"/>
  <rect x="15.2" y="41.6" width="33.6" height="9.5" rx="2.7" fill="url(#t3)"/>
  <rect x="42.7" y="45.8" width="2" height="1.2" rx="0.6" fill="#9a2c0c" fill-opacity="0.38"/>
  <rect x="15.2" y="30.3" width="33.6" height="9.5" rx="2.7" fill="url(#t2)"/>
  <rect x="41.8" y="34.5" width="2.9" height="1.2" rx="0.6" fill="#c2410c" fill-opacity="0.52"/>
  <rect x="15.2" y="19" width="33.6" height="9.5" rx="2.7" fill="url(#t1)"/>
  <rect x="40.7" y="23.2" width="4" height="1.2" rx="0.6" fill="#ea580c" fill-opacity="0.88"/>
</svg>
